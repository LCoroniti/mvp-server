spring.application.name=webserver
# Database properties. The defaults point to the local docker-compose database
# (see docker-compose.yml); in production the TUS_HEROKU_* variables are set.
spring.datasource.url=${TUS_HEROKU_URL:jdbc:postgresql://localhost:5432/mvp}
spring.datasource.username=${TUS_HEROKU_USERNAME:mvp}
spring.datasource.password=${TUS_HEROKU_PASSWORD:mvp}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
# Creates/updates the schema automatically (there are no migration scripts yet).
# Set DDL_AUTO=none if the schema must not be touched.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.web.resources.add-mappings=true
spring.mvc.view.prefix=/static/
spring.mvc.view.suffix=.html
server.port=${PORT:8080}
spring.profiles.active=prod
# Credentials for the admin area (/admin/*, mutating endpoints, /api/scheduler).
# MUST be overridden in production via the ADMIN_USERNAME/ADMIN_PASSWORD env vars.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin}
