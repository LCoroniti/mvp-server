apply plugin: 'java'

dependencies {
    implementation 'org.jsoup:jsoup:1.18.1'
    compileOnly 'org.apache.httpcomponents.client5:httpclient5:5.3.1'
    compileOnly 'org.apache.httpcomponents.core5:httpcore5:5.3.1'
